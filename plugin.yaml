name: kalico-monitor
version: 0.3.0
manifest_version: 2
requires_hermes: ">=0.21.6"
description: >-
  Read-only /kalico status, temp, force, alerts, health slash commands without LLM
  plus a separately supervised realtime Moonraker WebSocket alert daemon.
author: wangyh775 (state logic adapted from TakeshiTGAL/klipper-print-watch)
license: MIT
homepage: https://github.com/wangyh775/hermes-plugin-kalico-monitor
tags: [kalico, klipper, moonraker, realtime, monitoring, feishu]
provides_tools:
  - kalico_status
  - kalico_monitor_health
  - kalico_force
optional_env:
  - name: KALICO_MONITOR_ENV_FILE
    description: Path to the shared Kalico monitor environment file (same Linux user)
    prompt: Shared monitor environment file path
    secret: false
    password: false
  - name: MOONRAKER_URL
    description: Optional override of the shared Moonraker URL
    prompt: Moonraker URL (fallback when shared config does not define it)
    secret: false
    password: false
  - name: MOONRAKER_API_KEY
    description: Optional key for Moonraker; never returned to a chat
    prompt: Moonraker API key (optional)
    secret: true
    password: true
  - name: KALICO_ALLOWED_CHAT_IDS
    description: Comma-separated IDs of chats permitted to use /kalico remotely
    prompt: Optional additional chat allowlist (Hermes handles primary access)
    secret: false
    password: false
