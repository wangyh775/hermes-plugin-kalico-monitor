name: kalico-monitor
version: 0.1.0
manifest_version: 2
requires_hermes: ">=0.21.6"
description: >-
  Read-only Hermes tools plus an independently supervised Moonraker WebSocket
  monitor with SQLite outbox and signed Hermes direct-delivery webhooks.
  No camera, no LLM calls for automatic alerts, no printer control operations.
author: wangyh775 (realtime extension inspired by TakeshiTGAL/klipper-print-watch)
license: MIT
homepage: https://github.com/wangyh775/hermes-plugin-kalico-monitor
tags: [kalico, klipper, moonraker, realtime, monitor, alert]
provides_tools:
  - kalico_status
  - kalico_monitor_health
requires_env:
  - name: MOONRAKER_URL
    description: Moonraker origin, for example http://127.0.0.1:7125
    prompt: Moonraker URL
    secret: false
    password: false
optional_env:
  - name: MOONRAKER_API_KEY
    description: Optional Moonraker API key
    prompt: API key (empty for trusted local host)
    secret: true
    password: true
