[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-kalico-monitor"
version = "0.1.0"
description = "Realtime Moonraker event monitoring and zero-LLM Hermes notifications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "wangyh775"}]
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
kalico-monitor = "kalico_monitor.monitor:main"

[tool.setuptools]
packages = ["kalico_monitor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
